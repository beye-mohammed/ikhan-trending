name: Update TMDB Trending

on:
  schedule:
    # Every Monday at 06:00 UTC — بدلها اللي بغيتي
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # كتخليك تشغلها يدوياً من تبويب Actions

permissions:
  contents: write

jobs:
  fetch-trending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch trending data from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/fetch_trending.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trending.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update trending data ($(date -u +'%Y-%m-%d'))"
            git push
          fi
